[versions]
agp = "9.3.2"
kotlin = "2.3.20"
compileSdk = "37"
minSdk = "26"
targetSdk = "37"
androidx-junit = "1.3.0"
# AndroidJUnitRunner itself. androidx.test.ext:junit does NOT pull it in, and without it the
# instrumentation APK dies at startup with ClassNotFoundException on the runner it names.
androidx-test-runner = "1.7.0"
junit = "4.13.2"
uiautomator = "2.4.0"

[libraries]
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
junit = { module = "junit:junit", version.ref = "junit" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
